logging:
    level:
        com.smartspeak.english_app.jwt: INFO
        com.smartspeak.english_app: INFO

spring:
    config:
        import: optional:file:.env[.properties]
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/english-app}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
        driver-class-name: com.mysql.cj.jdbc.Driver


    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        database: mysql
        database-platform: org.hibernate.dialect.MySQLDialect

    web:
        resources:
            static-locations: classpath:/static/,classpath:/public/

application:
    security:
        jwt:
            secret-key: ${JWT_SECRET_KEY}
            expiration: 2592000000
            refresh-token:
                expiration: 604800000

smtp:
    host: ${SMTP_HOST:smtp.yandex.ru}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}

backup:
    enabled: ${BACKUP_ENABLED:false}
    database:
        name: ${BACKUP_DB_NAME:english-app}
        host: ${BACKUP_DB_HOST:localhost}
        port: ${BACKUP_DB_PORT:3306}
        username: ${BACKUP_DB_USERNAME:root}
        password: ${BACKUP_DB_PASSWORD:}
    yandex-disk:
        token: ${YANDEX_DISK_TOKEN:}

rate:
    limit: 10

time:
    duration:
        in:
            minutes: 1
